# Nouveautés : à chaque pull request fusionnée dans main, la description de la PR dit ce que voient les utilisateurs.
#
# Consigne (détail dans scripts/nouveautes/lire_description.py et docs/mise-en-service.md § 3) :
# - section « ## Quoi de neuf » (première ligne « Titre : ... », puis une phrase ou deux) pour ce qui se voit à
#   l'écran avec les modules actifs : une entrée est proposée en BROUILLON. Le super administrateur relit et publie
#   dans Console › Quoi de neuf. Fonction appelée : public.notice_from_pull_request (0262), réservée au serveur ; une
#   même PR ne crée jamais deux entrées.
# - section « ## Avancées techniques » (une phrase courte) pour le reste : la phrase est ajoutée à l'entrée publiée
#   « Avancées techniques », une seule fois, si elle respecte les règles d'écriture (sinon rien n'est ajouté).
# - aucune des deux sections : rien n'est proposé.
# Les textes passent par des variables psql (jamais collés dans la requête).

name: Nouveautés

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  brouillon:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/nouveautes

      - name: Client PostgreSQL
        run: psql --version

      - name: Lecture de la description
        env:
          PR_TEXTE: ${{ github.event.pull_request.body }}
        run: |
          mkdir -p "$RUNNER_TEMP/nouveautes"
          python3 -I scripts/nouveautes/lire_description.py "$RUNNER_TEMP/nouveautes"
          if [ -s "$RUNNER_TEMP/nouveautes/alertes.txt" ]; then
            { echo "Règles d'écriture :"; sed 's/^/- /' "$RUNNER_TEMP/nouveautes/alertes.txt"; } | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Quoi de neuf et Avancées techniques
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PR_NUMERO: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          d="$RUNNER_TEMP/nouveautes"
          titre="$(cat "$d/titre.txt")"
          texte="$(cat "$d/texte.txt")"
          ligne="$(cat "$d/ligne.txt")"
          if [ -z "$titre" ] && [ -z "$ligne" ]; then
            echo "Aucune section « Quoi de neuf » ni « Avancées techniques » : rien n'est proposé." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ -n "$SUPABASE_DB_URL" ] || { echo "Secret SUPABASE_DB_URL absent : rien à faire."; exit 0; }
          present="$(psql "$SUPABASE_DB_URL" -X -At -v ON_ERROR_STOP=1 \
            -c "select to_regprocedure('public.notice_from_pull_request(integer,text,text,text)') is not null")"
          if [ "$present" != "t" ]; then
            echo "Migration 0262 pas encore appliquée : aucune entrée proposée."
            exit 0
          fi

          if [ -n "$titre" ]; then
            id="$(psql "$SUPABASE_DB_URL" -X -At -v ON_ERROR_STOP=1 \
              -v numero="$PR_NUMERO" -v titre="$titre" -v texte="$texte" -v url="$PR_URL" <<'SQL'
          select coalesce(public.notice_from_pull_request(:'numero'::int, :'titre', :'texte', :'url')::text, 'déjà proposée');
          SQL
            )"
            echo "Entrée « Quoi de neuf » en brouillon : $id" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "$ligne" ]; then
            n="$(psql "$SUPABASE_DB_URL" -X -At -v ON_ERROR_STOP=1 -v ligne="$ligne" <<'SQL'
          with cible as (
            select id from public.platform_notices
             where kind = 'nouveaute' and status = 'publie' and title = 'Avancées techniques' and company_id is null
             order by published_at desc limit 1
          ), maj as (
            update public.platform_notices p
               set body = p.body || ' ' || :'ligne'
              from cible
             where p.id = cible.id
               and position(:'ligne' in p.body) = 0
               and length(p.body) + length(:'ligne') + 1 <= 4000
            returning p.id
          )
          select count(*) from maj;
          SQL
            )"
            if [ "$n" = "1" ]; then
              echo "Phrase ajoutée à « Avancées techniques » : $ligne" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "Phrase non ajoutée (entrée « Avancées techniques » absente, phrase déjà présente ou texte trop long) : $ligne" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi
